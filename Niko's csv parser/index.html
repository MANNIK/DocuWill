<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quoro — Riconciliazione documenti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --bg-elev: #faf8ff;
      --bg-sunken: #f5f2fb;
      --surface: #ffffff;
      --border: #ebe7f3;
      --border-strong: #d9d2ea;
      --text: #1a1626;
      --text-muted: #6c647e;
      --text-faint: #9a93ab;
      --accent: #7b5cf5;
      --accent-soft: #efeaff;
      --accent-strong: #6840f0;
      --accent-ink: #3a1f9c;
      --ok: #16a36b;
      --ok-soft: #e6f6ee;
      --warn: #d18a16;
      --warn-soft: #fdf4e0;
      --err: #d6385e;
      --err-soft: #fde9ee;
      --info: #3a6df0;
      --info-soft: #e7eeff;

      --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
      --font-display: "Geist", ui-sans-serif, system-ui, sans-serif;

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 0 rgba(20, 10, 50, 0.04);
      --shadow: 0 4px 14px -6px rgba(60, 30, 140, 0.12), 0 1px 0 rgba(20, 10, 50, 0.04);
      --shadow-lg: 0 24px 60px -20px rgba(60, 30, 140, 0.22);
    }

    /* Variant: Deep violet */
    [data-variant="deep"] {
      --bg: #f6f3fc;
      --bg-elev: #ffffff;
      --bg-sunken: #ece5f9;
      --surface: #ffffff;
      --border: #e0d6f1;
      --border-strong: #c6b6e5;
      --text: #1b1330;
      --text-muted: #574a73;
      --text-faint: #897fa5;
      --accent: #5b2bd9;
      --accent-soft: #e3d8ff;
      --accent-strong: #4516c0;
      --accent-ink: #2a0f7a;
    }

    /* Variant: Editorial (warm + serif headlines) */
    [data-variant="editorial"] {
      --bg: #faf7f0;
      --bg-elev: #ffffff;
      --bg-sunken: #f3eee2;
      --surface: #ffffff;
      --border: #ece4d3;
      --border-strong: #d8ccaf;
      --text: #1d1a15;
      --text-muted: #6c624f;
      --text-faint: #a39a83;
      --accent: #6a4cd1;
      --accent-soft: #ece4ff;
      --accent-strong: #533cad;
      --accent-ink: #2a1f6b;
      --font-display: "Newsreader", "Geist", serif;
    }
    [data-variant="editorial"] .display,
    [data-variant="editorial"] h1,
    [data-variant="editorial"] h2,
    [data-variant="editorial"] .panel-title-strong {
      font-family: var(--font-display);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    body { font-size: 14px; line-height: 1.45; }
    button { font-family: inherit; }
    a { color: inherit; }

    .mono { font-family: var(--font-mono); font-feature-settings: "ss01" on, "ss02" on; }
    .num { font-variant-numeric: tabular-nums; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    /* Reusable */
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
    .pill.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
    .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
    .pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
    .pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }

    .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; display: inline-block; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 120ms, border-color 120ms, transform 80ms; }
    .btn:hover { background: var(--bg-sunken); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
    .btn.ghost:hover { background: var(--bg-sunken); color: var(--text); }
    .btn.danger { color: var(--err); border-color: var(--border); }
    .btn.danger:hover { background: var(--err-soft); border-color: var(--err-soft); }
    .btn.sm { padding: 4px 8px; font-size: 12px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

    .kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; color: var(--text-muted); background: var(--surface); }

    /* App shell */
    .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }
    .sidebar { background: var(--bg-elev); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; height: 100vh; overflow: auto; }
    .main { display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow: hidden; }

    /* Topbar */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 5; }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
    .breadcrumbs strong { color: var(--text); font-weight: 500; }
    .breadcrumbs .sep { opacity: 0.5; }

    .content { padding: 28px; max-width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 22px; }
    .content.tight { padding: 0; }

    h1.display { font-size: 26px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.015em; }
    h2.display { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-muted); font-size: 13.5px; margin: 0; }

    /* Sidebar items */
    .logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; }
    .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); display: grid; place-items: center; color: white; font-weight: 700; font-family: var(--font-display); font-size: 15px; box-shadow: var(--shadow-sm); }
    .logo-name { font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
    .logo-name span { color: var(--text-faint); font-weight: 400; }

    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav .section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); padding: 10px 10px 4px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-muted); font-size: 13.5px; cursor: pointer; text-align: left; }
    .nav button:hover { background: var(--bg-sunken); color: var(--text); }
    .nav button.active { background: var(--accent-soft); color: var(--accent-ink); }
    [data-variant="deep"] .nav button.active { background: var(--accent-soft); color: var(--accent-ink); }
    .nav button .count { margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--bg-sunken); color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .nav button.active .count { background: rgba(255,255,255,0.6); color: var(--accent-ink); }
    .nav button .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8; }

    .sidebar-footer { margin-top: auto; padding: 8px 4px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); border-top: 1px solid var(--border); }
    .avatar { width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(135deg, #e7ddff, #c7b6ff); color: var(--accent-ink); display: grid; place-items: center; font-size: 11px; font-weight: 600; }

    /* Tables */
    table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    table.tbl th { text-align: left; font-weight: 500; color: var(--text-faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-elev); position: sticky; top: 0; }
    table.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.tbl tr:last-child td { border-bottom: none; }
    table.tbl tr:hover td { background: var(--bg-elev); }

    /* Field for compare */
    .field { display: flex; align-items: center; gap: 6px; }
    .field-strike { text-decoration: line-through; color: var(--text-faint); }

    /* Highlights for diff */
    .hl-err { background: var(--err-soft) !important; }
    .hl-warn { background: var(--warn-soft) !important; }
    .hl-info { background: var(--info-soft) !important; }
    .hl-ok { background: var(--ok-soft) !important; }
    .hl-cell-err { background: var(--err-soft); color: var(--err); border-radius: 4px; padding: 1px 5px; font-weight: 500; }
    .hl-cell-warn { background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 1px 5px; font-weight: 500; }
    .hl-cell-info { background: var(--info-soft); color: var(--info); border-radius: 4px; padding: 1px 5px; font-weight: 500; }
    .hl-cell-ok { background: var(--ok-soft); color: var(--ok); border-radius: 4px; padding: 1px 5px; font-weight: 500; }

    /* Unified diff table separator column */
    .diff-tbl { border-collapse: separate; border-spacing: 0; }
    .diff-tbl .diff-sep { width: 16px; padding: 0 !important; background: var(--bg-sunken) !important; border-left: 1px solid var(--border) !important; border-right: 1px solid var(--border) !important; border-bottom: none !important; }
    .diff-tbl tr:hover td.diff-sep { background: var(--bg-sunken) !important; }
    .diff-tbl td.side-l, .diff-tbl th.side-l { background-color: rgba(255,255,255,0.6); }
    .diff-tbl td.side-r, .diff-tbl th.side-r { background-color: var(--accent-soft); background-color: color-mix(in oklab, var(--accent-soft) 35%, transparent); }
    .diff-tbl tr:hover td.side-l { background-color: var(--bg-elev); }
    .diff-tbl tr:hover td.side-r { background-color: color-mix(in oklab, var(--accent-soft) 60%, transparent); }
    /* Severity highlight should still win over side tint */
    .diff-tbl tr.hl-err td.side-l, .diff-tbl tr.hl-err td.side-r { background-color: var(--err-soft) !important; }
    .diff-tbl tr.hl-warn td.side-l, .diff-tbl tr.hl-warn td.side-r { background-color: var(--warn-soft) !important; }
    .diff-tbl tr.hl-info td.side-l, .diff-tbl tr.hl-info td.side-r { background-color: var(--info-soft) !important; }
    .diff-tbl .side-banner { padding: 8px 12px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); background: var(--bg-elev); border-bottom: 1px solid var(--border); }
    .diff-tbl .side-banner.l { color: var(--text-muted); }
    .diff-tbl .side-banner.r { color: var(--accent-ink); background: var(--accent-soft); }

    /* Photo placeholder */
    .photo {
      background:
        repeating-linear-gradient(135deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 9px),
        linear-gradient(180deg, #eee9f7, #e0d6f1);
      display: grid; place-items: center; color: var(--text-faint); font-family: var(--font-mono); font-size: 11px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
    .fade-in { animation: fadeIn 200ms ease both; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 1.5s infinite; }

    /* Tweaks panel adjustments */
    .tweaks-panel { font-family: var(--font-sans) !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="src/data.js"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/screens/dashboard.jsx"></script>
  <script type="text/babel" src="src/screens/upload.jsx"></script>
  <script type="text/babel" src="src/screens/inbox.jsx"></script>
  <script type="text/babel" src="src/screens/reconcile.jsx"></script>
  <script type="text/babel" src="src/screens/supplier.jsx"></script>
  <script type="text/babel" src="src/screens/settings.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
